<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"Helvetica Neue",sans-serif;color:#fff;background:radial-gradient(circle at 30% 20%,#5fd0ff,#12b0ff 55%,#0a78c8)}
.c{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.w{position:relative;width:132px;height:132px}
.w img{width:132px;height:132px;border-radius:28px;opacity:0;transform:scale(.3) rotate(-10deg);animation:pop 1s cubic-bezier(.2,1.5,.4,1) .2s forwards;filter:drop-shadow(0 12px 22px #0007)}
.ring{position:absolute;inset:-26px;border-radius:50%;border:2px solid #fff3;border-top-color:#fff;opacity:0;animation:fi .5s .4s forwards,spin 1.6s linear infinite}
h1{font-weight:300;font-size:54px;letter-spacing:8px;margin:30px 0 6px 8px;display:flex}
h1 span{opacity:0;transform:translateY(18px);animation:up .5s forwards}
.bar{width:230px;height:3px;background:#fff4;margin-top:22px;border-radius:2px;overflow:hidden}
.bar div{height:100%;width:0;background:#fff;animation:ld 2.5s .4s ease-in-out forwards}
body{animation:out .45s 2.55s forwards}
@keyframes pop{to{transform:none;opacity:1}}@keyframes fi{to{opacity:1}}@keyframes up{to{opacity:1;transform:none}}
@keyframes ld{to{width:100%}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes out{to{opacity:0}}
</style></head><body><div class="c"><div class="w"><div class="ring"></div><img src="assets/icon.png"></div>
<h1 id="t"></h1><div class="bar"><div></div></div></div>
<script>"Taccuino".split('').forEach((ch,n)=>{const s=document.createElement('span');s.textContent=ch;s.style.animationDelay=(0.8+n*.1)+'s';t.append(s)});</script></body></html>
